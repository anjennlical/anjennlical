<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc"><title id="title">Sakura OS — hello, I’m lari!</title><desc id="desc">Midnight sakura terminal, original pixel cat Sakura Byte, and a slowly revealed curiosity.exe message.</desc><defs><linearGradient id="night" x2="1" y2="1"><stop stop-color="#25152E"/><stop offset=".55" stop-color="#110E19"/><stop offset="1" stop-color="#211B36"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#B89CFF" stroke-opacity=".055"/></pattern></defs><style>
