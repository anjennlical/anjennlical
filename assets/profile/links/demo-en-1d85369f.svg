<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 149 44" width="149" height="44" role="img" aria-labelledby="title desc"><title id="title">Technical demo</title><desc id="desc">Technical demo — navigation link</desc><defs><linearGradient id="night" x2="1" y2="1"><stop stop-color="#25152E"/><stop offset=".55" stop-color="#110E19"/><stop offset="1" stop-color="#211B36"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#B89CFF" stroke-opacity=".055"/></pattern></defs><g font-family="Segoe UI, Arial, sans-serif" fill="#F9F4FF"><style>.button-arrow{animation:sakura-nudge 8s ease-in-out -2.5s infinite}.button-trace{animation:sakura-trace 8s ease-in-out -2.5s infinite}@keyframes sakura-nudge{0%,8%,44%,100%{transform:translateX(0)}20%,30%{transform:translateX(3px)}}@keyframes sakura-trace{0%,10%,62%,100%{opacity:0}30%,40%{opacity:.7}}@media(prefers-reduced-motion:reduce){.button-arrow,.button-trace{animation:none}}</style><rect x="1" y="6" width="147" height="32" rx="9" fill="#FFB5DA" stroke="#FFB5DA"/><path class="button-trace" opacity="0" d="M16 7H133" fill="none" stroke="#9D3269" stroke-width="2" stroke-linecap="round"/><text x="62.5" y="26.5" text-anchor="middle" font-size="13" font-weight="600" fill="#291229">Technical demo</text><path class="button-arrow" d="m128 17 5 5-5 5m-6-5h11" fill="none" stroke="#291229" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
