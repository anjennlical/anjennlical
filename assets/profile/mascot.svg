<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" width="160" height="150" role="img" aria-labelledby="title desc"><title id="title">Sakura Byte</title><desc id="desc">Original lavender pixel cat with a pink circuit bow and a tiny terminal.</desc><defs><linearGradient id="night" x2="1" y2="1"><stop stop-color="#25152E"/><stop offset=".55" stop-color="#110E19"/><stop offset="1" stop-color="#211B36"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#B89CFF" stroke-opacity=".055"/></pattern></defs><style>
 .star { animation: twinkle 5s ease-in-out infinite; } .star:nth-child(2n) { animation-delay: -2.5s; }
 .tail { transform-origin: 98px 116px; animation: sway 5s ease-in-out infinite; }
 .cursor { animation: cursor 2.8s ease-in-out infinite; }
 .typed { animation: type 12s steps(31, end) infinite; }
 @keyframes twinkle { 0%,100% {opacity:.45} 50% {opacity:1} }
 @keyframes sway { 0%,100% {transform:rotate(-4deg)} 50% {transform:rotate(7deg)} }
 @keyframes cursor {0%,100% {opacity:.3} 50% {opacity:1}}
 @keyframes type {0%,100% {clip-path:inset(0 100% 0 0)} 25%,88% {clip-path:inset(0 0 0 0)}}
 @media (prefers-reduced-motion: reduce) { .star,.tail,.cursor,.typed {animation:none} }
 </style><g font-family="Segoe UI, Arial, sans-serif" fill="#F9F4FF"><g transform="translate(10 6)"><g shape-rendering="crispEdges">
